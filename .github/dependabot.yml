version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      pre-commit:
        patterns:
          - "*"
    ignore:
      # Dependabot fails on the upper-case `V` tags of latexindent.pl (unknown_error); other hooks still update.
      - dependency-name: "https://github.com/cmhughes/latexindent.pl"
    cooldown:
      default-days: 7
