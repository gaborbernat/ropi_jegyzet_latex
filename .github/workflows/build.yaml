name: Build LaTeX document
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "3 11 * * *"
permissions: {}
jobs:
  pdf:
    uses: tox-dev/github-workflows/.github/workflows/latex-to-pages.yaml@ef0cd88bef592260a48345753b8b509b209ab189 # 6.8.3
    permissions:
      contents: write
      pages: read
    with:
      root-file: main.tex
